# Footage sources. The tool REFUSES to process a source unless:
#   permission: granted   AND   permission_proof is filled in.
# Ask the streamer first (see docs/outreach_message.md), then write where the OK is.

sources:
  - id: example_streamer_vod1
    streamer: "ExampleStreamer"
    permission: pending                 # change to "granted" only after you have a written OK
    permission_proof: ""                # e.g. "Twitter DM 2026-11-16, screenshot in proofs/example.png"
    url: "https://www.youtube.com/watch?v=XXXXXXXXXXX"   # a VOD you may use (yt-dlp downloads it) ...
    path: ""                                            # ... or a local file they sent you
    credit_url: "https://www.youtube.com/@ExampleStreamer"
    language: en
    # crop: [0, 0, 1920, 1080]          # optional: gameplay rectangle if auto-detection is wrong
