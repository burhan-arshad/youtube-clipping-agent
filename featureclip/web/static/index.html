<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>featureclip</title>
<style>
  :root{
    --bg:#0d1017; --panel:#151a24; --panel2:#1b2230; --line:#27304a; --text:#e8ecf6; --muted:#8e99b3;
    --accent:#ffb21f; --accent2:#ff5c8a; --ok:#39d98a; --bad:#ff6b6b; --warn:#ffd166; --info:#5cc8ff;
    --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --bg:#f3f5fa; --panel:#ffffff; --panel2:#f0f2f8; --line:#dfe3ee; --text:#1a2030; --muted:#6a7590;
    --accent:#e08a00; --accent2:#d63a6a; --shadow:0 8px 24px rgba(30,40,80,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100%}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;
        display:flex;flex-direction:column;gap:6px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.3px;padding:0 10px 14px}
  .brand span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;
              background-clip:text;color:transparent}
  nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;
             color:var(--muted);font-weight:600;width:100%;box-sizing:border-box}
  nav button:hover{background:var(--panel2);color:var(--text)}
  nav button.on{background:linear-gradient(90deg,rgba(255,178,31,.16),rgba(255,92,138,.10));color:var(--text);
                box-shadow:inset 3px 0 0 var(--accent)}
  nav .badge{margin-left:auto;background:var(--accent);color:#1a1200;border-radius:99px;font-size:12px;
             padding:1px 8px;font-weight:800}
  #bell .badge{background:var(--accent);color:#1a1200;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px;font-weight:800}
  .side-foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:10px;border-top:1px solid var(--line)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:7px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.run{background:var(--accent);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  main{padding:30px 34px 60px;max-width:1280px;width:100%}
  h1{margin:0 0 4px;font-size:26px} .sub{color:var(--muted);margin:0 0 22px}
  h2{font-size:16px;margin:0 0 12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;
        box-shadow:var(--shadow);margin-bottom:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px} @media(max-width:1000px){.grid2{grid-template-columns:1fr}}
  label{display:block;font-weight:600;font-size:13.5px;margin:12px 0 5px}
  .help{color:var(--muted);font-size:12.5px;margin-top:4px}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:10px 12px;font:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,178,31,.18)}
  .row{display:flex;gap:10px;align-items:center} .row>*{flex:1} .row>.fit{flex:0 0 auto}
  button.btn{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;
             background:var(--panel2);color:var(--text);border:1px solid var(--line);transition:.15s}
  button.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  button.btn.primary{background:linear-gradient(90deg,var(--accent),#ff8a3c);color:#1a1200;border:0}
  button.btn.good{background:var(--ok);color:#04210f;border:0}
  button.btn.danger{background:transparent;color:var(--bad);border-color:rgba(255,107,107,.45)}
  button.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.btn.sm{padding:6px 11px;font-size:13px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{cursor:pointer;padding:7px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line);
        font-weight:600;font-size:13.5px;color:var(--muted)}
  .chip.on{background:var(--accent);color:#1a1200;border-color:var(--accent)}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);
        color:var(--muted)}
  .pill.ready{background:rgba(92,200,255,.16);color:var(--info)} .pill.approved{background:rgba(57,217,138,.16);color:var(--ok)}
  .pill.uploaded{background:rgba(57,217,138,.30);color:var(--ok)} .pill.dropped,.pill.error,.pill.rejected{background:rgba(255,107,107,.15);color:var(--bad)}
  .pill.running{background:rgba(255,178,31,.2);color:var(--accent)} .pill.done{background:rgba(57,217,138,.16);color:var(--ok)}
  .pill.stopped,.pill.queued{background:var(--panel2);color:var(--muted)}
  .log{background:#080b11;color:#c7d0e6;border:1px solid var(--line);border-radius:12px;padding:14px;
       font:12.5px/1.55 ui-monospace,Consolas,monospace;height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  .log .e{color:#ff8f8f} .log .ok{color:#7ee2a8} .log .t{color:#6c7aa0}
  .clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
  .clip{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
        display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .clip video{width:100%;aspect-ratio:9/16;background:#000;display:block;max-height:520px;object-fit:contain}
  .clip .nov{aspect-ratio:9/16;max-height:200px;display:flex;align-items:center;justify-content:center;
             color:var(--muted);background:var(--panel2);padding:14px;text-align:center;font-size:13px}
  .clip .body{padding:14px;display:flex;flex-direction:column;gap:8px}
  .clip input.title{font-weight:700;padding:8px 10px}
  .meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
  details p{margin:6px 0 0;font-size:13.5px;color:var(--text)}
  .why{font-size:13px;color:var(--bad);background:rgba(255,107,107,.08);padding:8px 10px;border-radius:8px}
  .empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .steps li:last-child{border:0}
  .steps li:before{content:counter(s);flex:0 0 30px;height:30px;border-radius:50%;background:var(--panel2);
        display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
  .steps li.done:before{content:"✓";background:var(--ok);color:#04210f}
  .jobs{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}
  .job{cursor:pointer;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;
       display:flex;gap:10px;align-items:center;justify-content:space-between}
  .job.on{border-color:var(--accent)} .job .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grp{margin-top:6px} .grp h2{color:var(--accent);margin-top:22px}
  .toggle{display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;font-weight:600}
  .toggle input{width:18px;height:18px;accent-color:var(--accent)}
  .toast{position:fixed;right:22px;bottom:22px;background:var(--panel);border:1px solid var(--line);
         border-left:4px solid var(--accent);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);
         max-width:420px;z-index:50;animation:in .2s}
  .toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}
  @keyframes in{from{transform:translateY(10px);opacity:0}}
  img.preview{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .kv b{color:var(--muted);font-weight:600}
  .check{display:flex;gap:8px;align-items:center;padding:4px 0}
  .theme{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px;padding:6px 10px}
  @media(max-width:820px){.shell{grid-template-columns:1fr} aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
    .side-foot{display:none} main{padding:20px 16px}}
  /* phone view */
  @media(max-width:820px){
    aside{padding:10px 10px 4px;gap:2px;position:sticky;top:0;z-index:20}
    .brand{padding:0 8px 6px;font-size:17px}
    nav{display:flex;gap:4px;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav button{width:auto;white-space:nowrap;padding:9px 12px;flex:0 0 auto}
    h1{font-size:22px} .card{padding:14px} .clips{grid-template-columns:1fr}
    .clip video{max-height:60vh} button.btn{min-height:42px} button.btn.sm{min-height:38px}
    input[type=text],input[type=password],input[type=number],select,textarea{font-size:16px}
    .kv{grid-template-columns:1fr} .row{flex-wrap:wrap}
    table{display:block;overflow-x:auto;white-space:nowrap}
    .toast{left:12px;right:12px;bottom:12px;max-width:none}
    .feed{max-height:240px}
  }
  #banner .bar{padding:9px 16px;background:rgba(255,107,107,.14);border-bottom:1px solid var(--bad);font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  #banner .bar.warn{background:rgba(255,209,102,.14);border-color:var(--warn)}
  .qbar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;min-width:60px}.qbar>i{display:block;height:100%;background:var(--ok)}
  .qbar.low>i{background:var(--warn)}.qbar.out>i{background:var(--bad)}
  .qrow{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
  .tl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .tl .x{flex:0 0 auto}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,178,31,.55)}70%{box-shadow:0 0 0 10px rgba(255,178,31,0)}100%{box-shadow:0 0 0 0 rgba(255,178,31,0)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.live-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite;flex:none}
.live-dot.idle{background:var(--muted);animation:none}.live-dot.bad{background:var(--bad);animation:none}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0}
.step{padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.step.done{color:var(--ok);border-color:rgba(57,217,138,.4)}
.step.active{color:#111;background:var(--accent);border-color:var(--accent);font-weight:700;animation:pulse 1.6s infinite}
.step+.step::before{content:"";}
.pbar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .6s}
.pbar.ind>i{width:40%;position:absolute;animation:slide 1.4s infinite linear}
.feed{font-size:12.5px;line-height:1.55}.feed div{padding:3px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.feed .t{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.cnt span{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px}.cnt b{font-size:15px}
.tbl{border-collapse:collapse;font-size:13px}.tbl th{color:var(--muted);font-weight:600;padding:4px 8px;text-align:center}.tbl td{padding:5px 8px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="banner"></div>
<div class="shell">
  <aside>
    <div class="brand"><span>feature</span>clip</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="foot"></div>
      <button class="theme" id="bell" style="font-size:16px"></button>
      <button class="theme" id="themeBtn">☾ / ☀ theme</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="toasts"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {};                // /api/state
let tab = localStorage.getItem("tab") || "assistant";
let clipFilter = "ready";
let activeJob = null;      // job id shown in Create/Activity
let jobSince = 0;
let settingsCache = null;

async function api(path, opts = {}) {
  const o = {headers: {"Content-Type": "application/json"}, ...opts};
  if (o.body && typeof o.body !== "string") o.body = JSON.stringify(o.body);
  const r = await fetch(path, o);
  let data = null;
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((data && (data.detail || data.message)) || r.statusText);
  return data;
}
function toast(msg, kind="") {
  const d = document.createElement("div");
  d.className = "toast " + kind; d.textContent = msg;
  $("#toasts").appendChild(d);
  setTimeout(() => d.remove(), kind === "bad" ? 9000 : 4500);
}
const TABS = [
  ["assistant", "🤖", "Assistant"], ["create", "🎬", "New video"], ["clips", "🎞️", "Clips"], ["activity", "📜", "Activity / Log"],
  ["usage", "📊", "Gemini usage"], ["settings", "⚙️", "Settings"], ["youtube", "▶️", "YouTube upload"],
];
function renderNav() {
  const ready = (S.counts && S.counts.ready) || 0;
  $("#nav").innerHTML = TABS.map(([id, ic, name]) =>
    `<button data-t="${id}" class="${tab===id?'on':''}">${ic} ${name}${id==='clips'&&ready?`<span class="badge">${ready}</span>`:''}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.t; localStorage.setItem("tab", tab); render(); });
  $("#foot").innerHTML =
    `<div><span class="dot ${S.has_key?'ok':'bad'}"></span>Gemini key ${S.has_key?'set':'missing'}</div>
     <div><span class="dot ${S.ffmpeg?'ok':'bad'}"></span>ffmpeg ${S.ffmpeg?'ok':'missing'}</div>
     <div><span class="dot ${S.running?'run':''}"></span>${S.running?esc(S.running).slice(0,34):'idle'}</div>`;
}
function render() { renderNav(); ({create: viewCreate, clips: viewClips, activity: viewActivity,
  settings: viewSettings, youtube: viewYoutube, usage: viewUsage, assistant: viewAssistant})[tab](); }

// ------------------------------------------------------------------ logs
function colorLine(l) {
  const e = esc(l);
  if (/ERROR|FAIL|Traceback/.test(l)) return `<div class="e">${e}</div>`;
  if (/-> ready|ACCEPT|OK|Finished|login complete/i.test(l)) return `<div class="ok">${e}</div>`;
  return `<div>${e}</div>`;
}
async function pollJob(targetSel, jobId, statusSel, onDone) {
  let since = 0, box = $(targetSel);
  if (!box) return;
  box.innerHTML = "";
  while (true) {
    let j;
    try { j = await api(`/api/jobs/${jobId}?since=${since}`); } catch (e) { break; }
    const el = $(targetSel);
    if (!el || activeJob !== jobId) return;           // user moved away
    if (j.lines.length) {
      const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      el.insertAdjacentHTML("beforeend", j.lines.map(colorLine).join(""));
      since = j.total;
      if (stick) el.scrollTop = el.scrollHeight;
    }
    if (statusSel && $(statusSel)) $(statusSel).innerHTML = `<span class="pill ${j.status}">${j.status}</span> ${esc(j.title)}`;
    if (j.status === "done" || j.status === "error" || j.status === "stopped") {
      if (j.error) toast(j.error, "bad");
      if (onDone) onDone(j);
      refreshState();
      return;
    }
    await new Promise(r => setTimeout(r, 1000));
  }
}
async function startJob(body, targetSel, statusSel, onDone) {
  try {
    const r = await api("/api/jobs", {method: "POST", body});
    activeJob = r.id;
    pollJob(targetSel, r.id, statusSel, onDone);
    refreshState();
    return r.id;
  } catch (e) { toast(e.message, "bad"); }
}

// ------------------------------------------------------------------ CREATE
let adj = {facecam: "auto", crop: ["", "", "", ""]};
const adjBody = () => {
  const c = adj.crop.map(v => parseFloat(v));
  return {facecam: adj.facecam === "auto" ? "" : adj.facecam, crop: c.every(v => !isNaN(v)) ? c : null};
};
function adjPanelHtml() {
  return `<div class="card">
    <h2>Layout preview &amp; adjust</h2>
    <p class="help" style="margin-top:0">The AI finds the webcam, chat and text overlays and keeps only the gameplay. Preview it before you start,
    and correct it if it is wrong: pick the webcam corner, or <b>drag a rectangle on the preview</b> around the gameplay you want to keep.</p>
    <div class="grid2" style="grid-template-columns:1fr 1fr 1fr 1fr;gap:10px">
      <div style="grid-column:span 2"><label>Webcam position</label>
        <select id="adjFace">${["auto","top-left","top-right","bottom-left","bottom-right","none"].map(o => `<option ${adj.facecam===o?'selected':''}>${o}</option>`).join("")}</select></div>
      <div style="grid-column:span 2;display:flex;align-items:end"><button class="btn sm" id="adjClear">Reset to auto</button></div>
      ${["Left %","Top %","Width %","Height %"].map((n, i) => `<div><label>${n}</label><input type="number" min="0" max="100" step="0.1" data-crop="${i}" value="${esc(adj.crop[i])}"></div>`).join("")}
    </div>
    <div class="actions">
      <button class="btn" id="prevVideo">🔍 Preview recorded video</button>
      <button class="btn" id="prevLive">🔴 Preview live stream</button>
    </div>
    <div id="previewBox"></div>
  </div>`;
}
function wireAdjust(getVideo, getLive) {
  $("#adjFace").onchange = e => adj.facecam = e.target.value;
  document.querySelectorAll("[data-crop]").forEach(el => el.oninput = () => adj.crop[+el.dataset.crop] = el.value);
  $("#adjClear").onclick = () => { adj = {facecam: "auto", crop: ["", "", "", ""]}; viewCreate(); };
  const show = j => {
    if (j.status !== "done") return;
    $("#previewBox").innerHTML = `<p class="help">Green = full gameplay area, Red = removed (webcam / chat / text), Yellow = what will appear in the clip.
      Drag on the image to choose the gameplay area yourself, then press Preview again.</p>
      <div id="pvWrap" style="position:relative;display:inline-block;max-width:100%;cursor:crosshair;user-select:none">
      <img class="preview" id="pvImg" draggable="false" src="/media/job/${j.id}/image?t=${Date.now()}"><div id="pvRect" style="position:absolute;border:2px dashed #fff;background:rgba(255,255,255,.12);display:none"></div></div>`;
    const wrap = $("#pvWrap"), img = $("#pvImg"), rect = $("#pvRect");
    let start = null;
    const pos = e => { const r = img.getBoundingClientRect(); return [Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1), Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1)]; };
    wrap.onmousedown = e => { start = pos(e); e.preventDefault(); };
    window.onmousemove = e => { if (!start || !$("#pvRect")) return; const p = pos(e), r = img.getBoundingClientRect();
      const x = Math.min(start[0], p[0]), y = Math.min(start[1], p[1]), w = Math.abs(p[0] - start[0]), h = Math.abs(p[1] - start[1]);
      Object.assign(rect.style, {display: "block", left: x * r.width + "px", top: y * r.height + "px", width: w * r.width + "px", height: h * r.height + "px"}); };
    window.onmouseup = e => { if (!start) return; const p = pos(e);
      const x = Math.min(start[0], p[0]), y = Math.min(start[1], p[1]), w = Math.abs(p[0] - start[0]), h = Math.abs(p[1] - start[1]); start = null;
      if (w < .1 || h < .1) { rect.style.display = "none"; return; }
      adj.crop = [x, y, w, h].map(v => (v * 100).toFixed(1));
      document.querySelectorAll("[data-crop]").forEach(el => el.value = adj.crop[+el.dataset.crop]);
      toast("Gameplay area set. Press Preview again to check it, then start.", "ok"); };
  };
  $("#prevVideo").onclick = () => startJob({kind: "layout", video: getVideo(), ...adjBody()}, "#log", "#jobStatus", show);
  $("#prevLive").onclick = () => startJob({kind: "layout", video: getLive(), live: true, refresh: true, ...adjBody()}, "#log", "#jobStatus", show);
}
function viewCreate() {
  $("#main").innerHTML = `
  <h1>New video</h1>
  <p class="sub">Paste a YouTube link (or choose a video file). Or let the <b>Assistant</b> tab do everything for you automatically.</p>
  ${!S.has_key ? `<div class="card" style="border-color:var(--bad)"><b>A Gemini API key is required first.</b>
     Open Settings and paste your key (free: aistudio.google.com/apikey).
     <div class="actions"><button class="btn primary" id="goSet">Open Settings</button></div></div>` : ""}
  <div class="card"><h2>What should be made?</h2>

      </div>
      <p class="help">Recording never stops while clips are being made. The first clips appear after about 8-12 minutes. The layout you set below is used for every piece.</p>
    </div>

  <div class="card">
    <div class="row"><h2 id="jobStatus" style="margin:0">Activity</h2></div>
    <div class="log" id="log"><span class="t">No job is running.</span></div>

  if ($("#goSet")) $("#goSet").onclick = () => { tab = "settings"; render(); };
  $("#pickFile").onclick = async () => {
    try { const r = await api("/api/pick", {method: "POST", body: {kind: "file"}}); if (r.path) $("#video").value = r.path; }
    catch (e) { toast(e.message, "bad"); }
  };
  const vals = () => ({video: $("#video").value, streamer: $("#streamer").value, credit_url: $("#credit").value, ...adjBody(),
    mode: $("#mkMode").value, clips: +$("#mkClips").value || 0});
  const need = () => { if (!$("#mkMode").value) { toast("Choose the clip type first: voice-over or streamer", "bad"); return false; }
    if (!(+$("#mkClips").value > 0)) { toast("Enter how many clips you want", "bad"); return false; } return true; };
  wireAdjust(() => $("#video").value, () => $("#liveUrl").value);
  $("#runBtn").onclick = () => need() && startJob({kind: "run", ...vals()}, "#log", "#jobStatus", j => {
    if (j.status === "done") { toast("Clips are ready! Open the Clips tab.", "ok"); renderNav(); } });
  $("#liveBtn").onclick = async () => {
    if (!need()) return;
    const id = await startJob({kind: "watch", ...vals(), video: $("#liveUrl").value, minutes: +$("#liveMin").value || 5},
      "#log", "#jobStatus", () => { if ($("#liveStop")) $("#liveStop").disabled = true; });
    if (id) { $("#liveStop").disabled = false; $("#liveStop").onclick = async () => { await api(`/api/jobs/${id}/stop`, {method: "POST"}); toast("Stopping; the recorded pieces will still be processed ..."); }; }
  };
  if (activeJob) pollJob("#log", activeJob, "#jobStatus");
}

const fmtT = ts => ts ? new Date(ts * 1000).toLocaleString([], {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
function reviewHtml(rv) {
  if (!rv) return "";
  const issues = (rv.issues || []).map(i => `<li><b>${esc(i.type)}</b>: ${esc(i.text)}</li>`).join("");
  const checks = (rv.checks || []).map(c => `<li>${c.ok ? "✅" : "❌"} ${esc(c.name)} ${c.detail ? `<span class="help">${esc(c.detail)}</span>` : ""}</li>`).join("");
  return `<details><summary>Assistant review: ${rv.ok ? "✅ passed" : "⚠️ problems"} (score ${Math.round(rv.score)})</summary>
    ${issues ? `<ul style="margin:6px 0;padding-left:18px">${issues}</ul>` : ""}<ul style="margin:6px 0;padding-left:18px;list-style:none">${checks}</ul></details>`;
}

function fieldHtml(f) {
  const k = esc(f.key), help = f.help ? `<div class="help">${esc(f.help)}</div>` : "";
  if (f.type === "bool") return `<label class="toggle"><input type="checkbox" data-key="${k}" ${f.value?'checked':''}> ${esc(f.label)}</label>${help}`;
  let input;
  if (f.type === "select") input = `<select data-key="${k}">${f.options.map(o => `<option value="${esc(o)}" ${String(f.value)===o?'selected':''}>${esc(o||'(none)')}</option>`).join("")}</select>`;
  else if (f.type === "password") input = `<input type="password" data-key="${k}" placeholder="${f.is_set ? 'Saved: ' + esc(f.masked) + ' (enter a new key to replace it)' : 'Paste here'}" autocomplete="off">`;
  else if (f.type === "number") input = `<input type="number" data-key="${k}" value="${esc(f.value)}">`;
  else input = `<input type="text" data-key="${k}" value="${esc(f.value)}" ${f.type==='folder'||f.type==='file'?'placeholder="(default)"':''}>`;
  if (f.type === "folder") input = `<div class="row">${input}<button class="btn sm fit" data-pick="folder" data-for="${k}">Browse</button><button class="btn sm fit" data-open data-for="${k}">Open</button></div>`;
  if (f.type === "file") input = `<div class="row">${input}<button class="btn sm fit" data-pick="file" data-for="${k}">Choose file</button></div>`;
  return `<label>${esc(f.label)}</label>${input}${help}`;
}

const fmtLeft = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60); return h ? `${h}h ${m}m` : `${m}m`; };
function drawQuota(Q) {
  const box = $("#asQuota"); if (!box || !Q) return;
  const rows = Q.models.filter(m => m.limit || m.cooling || m.used);
  const html = `<div class="card" style="padding:14px 18px">
    <div class="row" style="align-items:center"><div><b>🧮 AI free quota</b>
      <span class="help" style="margin-left:8px">${Q.usable}/${Q.total} models usable · about <b>${Q.total_left}</b> requests left today · resets <b>${esc(Q.reset_text)}</b> (in ${fmtLeft(Q.reset_in)})</span></div></div>
    <details style="margin-top:8px"><summary>Per model</summary>
    ${rows.map(m => { const pct = m.limit ? Math.min(100, Math.round(100 * m.used / m.limit)) : 0; const cls = m.cooling || pct >= 100 ? "out" : pct >= 75 ? "low" : "";
      return `<div class="qrow"><span>${esc(m.model)}</span><div class="qbar ${cls}"><i style="width:${pct}%"></i></div>
        <span class="help" style="margin:0">${m.used}${m.limit ? " / " + m.limit : ""}${m.cooling ? " · ⏸ " + esc(m.cooling.reason) : ""}</span></div>`; }).join("")}
    ${Q.tts.length ? `<div class="help" style="margin:8px 0 2px"><b>Voice (TTS)</b></div>` + Q.tts.map(m => { const pct = m.limit ? Math.min(100, Math.round(100 * m.used / m.limit)) : 0; const cls = m.cooling || pct >= 100 ? "out" : pct >= 75 ? "low" : "";
      return `<div class="qrow"><span>${esc(m.model)}</span><div class="qbar ${cls}"><i style="width:${pct}%"></i></div>
        <span class="help" style="margin:0">${m.used}${m.limit ? " / " + m.limit : ""}${m.cooling ? " · ⏸ " + esc(m.cooling.reason) : ""}</span></div>`; }).join("") : ""}
    </details></div>`;
  if (box._sig !== html) { const open = box.querySelector("details")?.open; box._sig = html; box.innerHTML = html; if (open) box.querySelector("details").open = true; }
}

    $("#asSave").onclick = async () => {
      const values = {}; document.querySelectorAll("#asForm [data-key]").forEach(el => values[el.dataset.key] = el.type === "checkbox" ? el.checked : el.value);
      try { await api("/api/settings", {method: "POST", body: values}); toast("Saved ✔", "ok"); await api("/api/assistant/run-now", {method: "POST"}); draw(); } catch (e) { toast(e.message, "bad"); }
    };
    $("#asTest").onclick = async () => { await api("/api/notifications/test", {method: "POST"}); toast("Sent. Check the bell, your phone (ntfy) or Telegram.", "ok"); refreshNotes(); };
  };
  const stateHtml = a => `<div class="row"><h2 style="margin:0;flex:2"><span class="dot ${a.enabled ? (a.state.state === 'working' ? 'run' : 'ok') : 'bad'}"></span>
      Assistant is ${a.enabled ? "ON (" + esc(a.mode) + " mode)" : "OFF"}</h2>
      <button class="btn sm fit" id="asToggle">${a.enabled ? "Switch off" : "Switch on"}</button><button class="btn sm fit" id="asNow">Check now</button></div>
    ${a.safe.on ? `<div style="margin-top:10px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;background:rgba(255,107,107,.1)">
        <b style="color:var(--bad)">🛑 SAFE MODE ON</b> <span class="help" style="margin:0">${esc(a.safe.reason || "")}</span>
        <div class="help" style="margin:4px 0 8px">No uploads, no new links, nothing is approved. Everything already on YouTube stays as it is.</div>
        <button class="btn sm fit" id="safeOff">Switch safe mode off</button>
        <button class="btn sm fit" id="safePull">Pull scheduled videos back to private</button>
        ${a.safe.held.length ? `<button class="btn sm fit" id="safeRelease">Re-schedule ${a.safe.held.length} held video(s) and resume</button>` : ""}</div>`
      : `<div style="margin-top:10px"><button class="btn sm fit danger" id="safeOn">🛑 Safe mode</button>
        <span class="help" style="margin-left:8px">One click stops all uploads and new work.</span></div>`}
    <div class="help" style="margin-top:8px">🚀 <b>Launch mode</b>: ${a.launch && a.launch.active
        ? `ON · ${a.launch.left} launch upload(s) left (1st now, then every ${a.launch.gap} min) <button class="btn sm fit" id="launchOff" style="margin-left:6px">Stop</button>`
        : `first clip public now, 2nd +1 h, 3rd +2 h, then the normal slots.`}
      <button class="btn sm fit" id="launchOn" style="margin-left:6px" title="Moves already scheduled videos into the launch times too">Start launch mode</button></div>
    <div class="help" style="margin-top:8px">💾 Free disk: <b>${a.disk.free_gb} GB</b>${a.disk.last ? ` · last cleanup freed ${a.disk.last.freed_mb} MB` : ""} <button class="btn sm fit" id="cleanNow" style="margin-left:6px">Clean now</button>
      <button class="btn sm fit" id="recheck" style="margin-left:6px" title="Review the rejected clips again with the newer, fairer rules">♻ Re-check rejected clips</button></div>
    <div class="help" style="margin-top:8px">${esc(a.state.message || "")} ${a.state.tick_error ? `<span style="color:var(--bad)">· ${esc(a.state.tick_error)}</span>` : ""}</div>
    <div class="chips" style="margin:12px 0 0"><span class="pill ready">${a.counts.ready} in review</span><span class="pill approved">${a.counts.approved} approved</span>
      <span class="pill uploaded">${a.counts.uploaded} uploaded</span><span class="pill rejected">${a.counts.rejected} rejected</span></div>`;
  const queueHtml = a => a.sources.length ? a.sources.map(s => `<div class="job" style="cursor:default;margin-bottom:6px">
      <span class="t" title="${esc(s.url)}"><span class="pill ${s.status==='running'?'running':s.status==='done'?'done':s.status==='error'?'error':'queued'}">${esc(s.status)}</span> ${esc(s.kind)} · ${esc(s.url.replace(/^https?:\/\//, "").slice(0, 46))}</span>
      <span>${s.status === "error" || s.status === "done" ? `<button class="btn sm" data-retry="${s.id}">Again</button> ` : ""}<button class="btn sm danger" data-del="${s.id}">✕</button></span></div>`).join("")
    : `<div class="help">The queue is empty.</div>`;
  const wireQueue = () => {
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { await api(`/api/assistant/sources/${b.dataset.del}`, {method: "DELETE"}); draw(); });
    document.querySelectorAll("[data-retry]").forEach(b => b.onclick = async () => { await api(`/api/assistant/sources/${b.dataset.retry}/retry`, {method: "POST"}); draw(); });
    if ($("#asToggle")) $("#asToggle").onclick = async () => {
      const on = $("#asToggle").textContent.includes("on");
      await api("/api/settings", {method: "POST", body: {"assistant.enabled": on}});
      if (on) await api("/api/assistant/run-now", {method: "POST"});
      toast(on ? "Assistant switched on" : "Assistant switched off", "ok"); draw(); };
    if ($("#asNow")) $("#asNow").onclick = async () => { await api("/api/assistant/run-now", {method: "POST"}); toast("Checking now ...", "ok"); };
    const post = async (url, body, msg) => { try { const r = await api(url, {method: "POST", body: body || {}}); toast(msg ? msg(r) : "Done", "ok"); } catch (e) { toast(e.message, "bad"); } draw(); };
    if ($("#launchOn")) $("#launchOn").onclick = () => { if (confirm("Launch mode: the first clip goes public NOW, the 2nd after 1 hour, the 3rd after 2 hours. Videos already scheduled on YouTube are moved into these times too. Continue?")) post("/api/launch", {count: 3}, r => `Launch mode ON (${r.moved} scheduled video(s) moved${r.failed && r.failed.length ? ", " + r.failed.length + " failed: " + r.failed[0].error : ""})`); };
    if ($("#launchOff")) $("#launchOff").onclick = () => post("/api/launch", {off: true}, () => "Launch mode off");
    if ($("#safeOn")) $("#safeOn").onclick = () => { if (confirm("Stop all uploads and new work?")) post("/api/safe", {on: true}, () => "Safe mode ON"); };
    if ($("#safeOff")) $("#safeOff").onclick = () => post("/api/safe", {on: false}, () => "Safe mode off, the assistant continues");
    if ($("#safePull")) $("#safePull").onclick = () => { if (confirm("Set every scheduled (not yet public) video back to private?")) post("/api/safe/pull-back", {}, r => `${r.pulled} video(s) pulled back` + (r.failed.length ? `, ${r.failed.length} failed` : "")); };
    if ($("#safeRelease")) $("#safeRelease").onclick = () => post("/api/safe/release", {}, r => `${r.rescheduled} video(s) scheduled again, safe mode off`);
    if ($("#recheck")) $("#recheck").onclick = () => post("/api/assistant/recheck-rejected", {}, r => `${r.requeued} clip(s) sent back for a fair re-check`);
    if ($("#cleanNow")) $("#cleanNow").onclick = () => post("/api/cleanup", {}, r => `Freed ${r.freed_mb} MB (${r.files} items), ${r.free_gb} GB free`);
    if ($("#learnRefresh")) $("#learnRefresh").onclick = () => post("/api/learn/refresh", {}, r => `Retrained on ${r.clips} Shorts`);
    if ($("#insRefresh")) $("#insRefresh").onclick = () => post("/api/insights/refresh", {}, r => `Stats updated for ${r.updated} video(s)`);
    if ($("#insApply")) $("#insApply").onclick = () => post("/api/insights/apply-slots", {}, r => "Publish times now: " + r.slots.join(", "));
  };
  const scoreChart = h => {
    if (!h.length) return `<div class="help">No reviewed clips yet.</div>`;
    const W = 640, H = 150, pad = 26, n = h.length, x = i => pad + (n === 1 ? (W - 2 * pad) / 2 : i * (W - 2 * pad) / (n - 1)), y = v => H - 14 - (v / 100) * (H - 28);
    const line = h.map((r, i) => `${x(i).toFixed(1)},${y(r.score).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-height:190px" role="img" aria-label="Review score of every clip over time">
      ${[0, 50, 100].map(v => `<line x1="${pad}" x2="${W - pad}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${v}</text>`).join("")}
      <line x1="${pad}" x2="${W - pad}" y1="${y(65)}" y2="${y(65)}" stroke="var(--warn)" stroke-dasharray="4 4"/>
      <polyline points="${line}" fill="none" stroke="var(--info)" stroke-width="1.5" opacity=".7"/>
      ${h.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.score).toFixed(1)}" r="3.5" fill="${r.ok ? "var(--ok)" : "var(--bad)"}"><title>#${r.id} ${esc(r.category)}: ${r.score} ${esc(r.title)}</title></circle>`).join("")}
    </svg><div class="help">Each dot is one clip (green = passed, red = problems). Dashed line = pass mark (65).</div>`;
  };
  const insightsHtml = ins => {
    const bar = (v, max) => `<span style="display:inline-block;height:8px;border-radius:4px;background:var(--accent);width:${Math.max(2, Math.round(100 * (v || 0) / (max || 1)))}px;vertical-align:middle"></span>`;
    const maxRate = Math.max(0.01, ...ins.categories.map(c => c.avg_rate || 0), ...ins.slots.map(c => c.avg_rate || 0));
    const sg = ins.suggestion;
    return `<div style="margin-top:10px">${scoreChart(ins.history)}
      <h2 style="margin-top:14px">By category</h2>
      ${ins.categories.length ? `<table class="tbl" style="width:100%"><tr><th align="left">Category</th><th>Clips</th><th>Avg score</th><th>Published</th><th>Views/hour</th><th>Avg views</th>${ins.analytics ? "<th>% watched</th>" : ""}</tr>
        ${ins.categories.map(c => `<tr><td>${esc(c.category)}</td><td align="center">${c.clips}</td><td align="center">${c.avg_score ?? "-"}</td><td align="center">${c.published}</td>
          <td>${c.avg_rate != null ? bar(c.avg_rate, maxRate) + " " + c.avg_rate : "-"}</td><td align="center">${c.avg_views ?? "-"}</td>${ins.analytics ? `<td align="center">${c.avg_pct ?? "-"}</td>` : ""}</tr>`).join("")}</table>` : `<div class="help">Nothing yet.</div>`}
      <h2 style="margin-top:14px">By publish time (PKT)</h2>
      ${ins.slots.length ? `<table class="tbl" style="width:100%"><tr><th align="left">Slot</th><th>Videos</th><th>Views/hour</th><th>Avg views</th><th>Avg likes</th></tr>
        ${ins.slots.map(c => `<tr><td>${esc(c.key)}</td><td align="center">${c.n}</td><td>${bar(c.avg_rate, maxRate)} ${c.avg_rate}</td><td align="center">${c.avg_views}</td><td align="center">${c.avg_likes}</td></tr>`).join("")}</table>`
        : `<div class="help">Results appear here ${ins.min_age_hours}+ hours after the first video is published and YouTube stats were read (needs YouTube login).</div>`}
      <div class="help" style="margin-top:10px">${sg.change ? `💡 <b>Suggestion:</b> replace ${esc(sg.drop)} with ${esc(sg.add)} → ${esc(sg.slots.join(", "))}. ${esc(sg.reason)}` : esc(sg.reason)}
        ${sg.change && ins.autotune !== "auto" ? ` <button class="btn sm fit" id="insApply">Apply</button>` : ""}</div>
      <div class="actions" style="margin-top:8px"><button class="btn sm fit" id="insRefresh">🔄 Read YouTube stats now</button>
        <span class="help" style="margin:0 0 0 8px">${ins.stats_ts ? "Last read " + new Date(ins.stats_ts * 1000).toLocaleString() : "Not read yet"} · auto-learn: ${esc(ins.autotune)}</span></div></div>`;
  };
  await draw();
  const t = setInterval(() => { if (tab !== "assistant") return clearInterval(t); draw(); }, 5000);
}

// ------------------------------------------------------------------ NOTIFICATIONS (bell)
let notes = {items: [], unread: 0}, lastNoteId = 0;
async function refreshNotes() {
  try {
    notes = await api("/api/notifications");
    const newest = notes.items[0] ? notes.items[0].id : 0;
    if (lastNoteId && newest > lastNoteId) notes.items.filter(n => n.id > lastNoteId).reverse().forEach(n => {
      toast(n.title + (n.body ? " — " + n.body.split("\n")[0] : ""), n.level === "error" ? "bad" : n.level === "ok" ? "ok" : "");
      try { if (window.Notification && Notification.permission === "granted") new Notification(n.title, {body: n.body}); } catch (e) {}
    });
    lastNoteId = newest;
    const b = $("#bell"); if (b) b.innerHTML = `🔔${notes.unread ? `<span class="badge">${notes.unread}</span>` : ""}`;
  } catch (e) {}
}
function toggleNotes() {
  let box = $("#noteBox");
  if (box) { box.remove(); return; }
  try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  box = document.createElement("div"); box.id = "noteBox";
  box.style.cssText = "position:fixed;left:240px;bottom:70px;width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:60";
  box.innerHTML = `<div class="row"><b>Notifications</b><button class="btn sm fit" id="noteRead">Mark all read</button></div>` +
    (notes.items.length ? notes.items.map(n => `<div style="padding:9px 0;border-bottom:1px solid var(--line);${n.read ? 'opacity:.6' : ''}"><b>${n.level === "error" ? "❌" : n.level === "warn" ? "⚠️" : n.level === "ok" ? "✅" : "ℹ️"} ${esc(n.title)}</b>
      <div class="help" style="margin:2px 0;white-space:pre-wrap">${esc(n.body)}</div><div class="help" style="margin:0">${esc(fmtT(n.ts))}</div></div>`).join("") : `<div class="help" style="padding:10px 0">No notifications yet.</div>`);
  document.body.appendChild(box);
  $("#noteRead").onclick = async () => { await api("/api/notifications/read", {method: "POST"}); await refreshNotes(); box.remove(); };
}

// ------------------------------------------------------------------ boot
async function refreshState() { try { S = await api("/api/state"); renderNav(); } catch (e) {} }
document.getElementById("themeBtn").onclick = () => {
  const r = document.documentElement, t = r.dataset.theme === "light" ? "dark" : "light";
  r.dataset.theme = t; try { localStorage.setItem("theme", t); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("#bell").onclick = toggleNotes;
async function checkStartup() {
  try {
    const r = await api("/api/startup-check"); const b = $("#banner");
    const bad = r.bad || [], warn = r.warn || [];
    if (!bad.length) { b.innerHTML = ""; return; }
    b.innerHTML = `<div class="bar"><b>⚠️ Start check:</b> ${bad.map(c => esc(c.name) + (c.detail ? " (" + esc(c.detail.slice(0, 80)) + ")" : "")).join(" · ")}
      <button class="btn sm" id="bnTest">Open self-test</button></div>`;
    $("#bnTest").onclick = () => { tab = "assistant"; localStorage.setItem("tab", tab); render(); setTimeout(() => runSelfTest(false), 200); };
  } catch (e) {}
}
checkStartup(); setInterval(checkStartup, 60000);
refreshState().then(render); refreshNotes(); setInterval(refreshNotes, 8000);
setInterval(refreshState, 5000);
</script>
</body>
